# Checkpoint C proposal only. Generating a plan is local; execution needs authorization.
# 6 categories x 2 recipes x 5 candidates = 60 slots, not 60 unique/new repositories.
limit_per_cohort = 5
per_page = 100
contributors_limit = 0

[budget]
total = 180
search = 36
repository_details = 144
contributors = 0
profiles = 0

[execution]
max_candidates = 60
max_new_repositories = 50
max_seconds = 300

