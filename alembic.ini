# github-radar Alembic configuration.

[alembic]
# Path to the migration scripts.
script_location = migrations

# Allow `import github_radar` inside migration env when run from the repo root.
prepend_sys_path = src

# SQLAlchemy URL is injected by `github-radar init-db` and migrations/env.py
# (falls back to the DATABASE_URL environment variable). The value below is
# only a placeholder for tooling that requires a non-empty string.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration (standard Alembic boilerplate).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S