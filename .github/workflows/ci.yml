name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate workflow YAML and expressions (no collection secrets)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_MODE: local
      GITHUB_TOKEN: ''
      AI_API_KEY: ''
      WORKSPACE_ADMIN_TOKEN: ''
      DATABASE_URL: postgresql+psycopg://unused@127.0.0.1/unreachable_application
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: python
        with:
          python-version: '3.12.15'
          update-environment: false
      - name: Select Python without native library overrides
        env:
          REVIEWED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          printf '%s\n' "$(dirname "$REVIEWED_PYTHON")" >> "$GITHUB_PATH"
          printf 'UV_PYTHON=%s\nUV_PYTHON_DOWNLOADS=never\n' "$REVIEWED_PYTHON" >> "$GITHUB_ENV"
      - run: python -m pip install uv==0.11.6
      - run: uv sync --frozen
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.14.1'
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - name: Isolated production SPA for real deployment smoke
        run: python deploy/build_frontend.py
      - name: Patched system libraries and PostgreSQL 16 (ephemeral CI only)
        run: |
          sudo bash deploy/install_ci_native.sh
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Verify actual loaded libpq, Python TLS and vendor OpenSSL backport
        run: uv run --frozen python -m github_radar.native
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src tests
      - name: Secret-free scheduling previews (no database or GitHub requests)
        run: |
          uv run --frozen github-radar automation run refresh
          uv run --frozen github-radar automation run discover
      - name: Full tests, migration and recovery on fresh PostgreSQL 16 TLS/SCRAM clusters
        run: uv run --frozen python -m tests.run_postgres
      - name: Locked Python dependency audit
        run: uv audit --locked
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: npm audit --omit=dev
