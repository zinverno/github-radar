name: Static preview artifact
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/static-preview*.yml'
      - 'docs/security/static-preview*'
      - 'docs/STATIC_PREVIEW*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.22.2'
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - run: mkdir -p ../build/preview-evidence
      - id: install
        run: env -i PATH="$PATH" npm --userconfig=/dev/null ci --ignore-scripts
      - run: npm run lint && npm run typecheck && npm test
      - run: env -i PATH="$PATH" npm --userconfig=/dev/null run build:preview
      - id: artifact
        run: node scripts/audit-preview.mjs dist-preview > ../build/preview-evidence/artifact.json
      - name: Production dependency audit (mandatory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=0
          env -i PATH="$PATH" npm --userconfig=/dev/null audit --omit=dev --json > ../build/preview-evidence/npm-production.json || status=$?
          printf '%s\n' "$status" > ../build/preview-evidence/npm-production.exit
          exit "$status"
      - name: Full dependency audit (retain raw failure; strict gate below)
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=0
          env -i PATH="$PATH" npm --userconfig=/dev/null audit --json > ../build/preview-evidence/npm-full.json || status=$?
          printf '%s\n' "$status" > ../build/preview-evidence/npm-full.exit
          exit "$status"
      - name: Preview security decision (unapproved exceptions fail)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.artifact.outcome == 'success' }}
        run: |
          git -C .. diff --exit-code
          node scripts/preview-security.mjs
      - name: Retain candidate for review even when dependency audit fails
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-radar-v0.1.0-preview-review
          path: web/dist-preview/
          retention-days: 7
          if-no-files-found: error
      - name: Retain complete audit findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-preview-audit-evidence
          path: build/preview-evidence/
          retention-days: 90
          if-no-files-found: error
