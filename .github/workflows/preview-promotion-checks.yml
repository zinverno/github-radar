name: Preview promotion checks
on:
  pull_request:
    paths:
      - '.github/workflows/*preview*.yml'
      - 'scripts/preview-promotion/**'
      - 'docs/preview-promotion.json'
      - 'docs/PREVIEW_PROMOTION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/preview-promotion -p 'test_*.py' -v
      - run: node --test scripts/preview-promotion/*.check.mjs
